name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stellartip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: stellartip_test
      JWT_SECRET: test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --passWithNoTests --forceExit

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stellartip_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: stellartip_e2e
      JWT_SECRET: e2e-secret-key
      STELLAR_NETWORK: testnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --forceExit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  api-diff:
    name: API Diff
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch main snapshot
        run: |
          git fetch origin main
          mkdir -p docs/openapi
          git show origin/main:docs/openapi/latest.json > docs/openapi/previous.json || true
      - name: Generate current OpenAPI spec
        run: npm run api:spec
      - name: Run openapi-diff (if previous exists)
        run: |
          if [ -s docs/openapi/previous.json ]; then
            npx openapi-diff docs/openapi/previous.json docs/openapi/current.json > api-diff.txt || true
          else
            echo "No previous OpenAPI snapshot found on main — skipping diff and breaking-change check." > api-diff.txt
          fi
      - name: Check for breaking changes
        shell: bash
        run: |
          if grep -E 'Incompatible|Removed|ERROR|ERROR:' api-diff.txt; then
            echo "Detected potentially breaking API changes." >&2
            PR_BODY="${{ github.event.pull_request.body }}"
            if echo "$PR_BODY" | grep -qiE 'api-breaking-change|BREAKING CHANGE'; then
              echo "Breaking change acknowledged in PR body"
            else
              echo "Breaking API changes detected but not documented in PR." >&2
              cat api-diff.txt >&2
              exit 1
            fi
          else
            echo "No breaking API changes detected."
          fi
